name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  repository-structure:
    name: Repository Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "Checking required files..."
          test -f README.md
          test -f docs/PRD.md
          test -f docs/ARCHITECTURE.md
          test -f docs/API.md
          test -f docs/DATABASE.md
          test -f docs/STATIC_ANALYSIS.md
          test -f docs/SECURITY_CHECKLIST.md
          test -f docs/PROJECT_SUMMARY_AND_NEXT_STEPS.md
          test -f backend-java/README.md
          test -f ai-service/README.md
          test -f frontend/README.md
          test -f .env.example
          test -f .gitignore
          test -f .semgrep.yml
          test -f scripts/static-scan.mjs
          test -f scripts/secret-scan.mjs
          test -f scripts/dependency-scan.mjs
          test -f scripts/run-evals.mjs
          test -f docker-compose.yml
          echo "All required files exist. Repository structure check passed."

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run static analysis
        run: REQUIRE_SEMGREP=1 node scripts/static-scan.mjs

  evals:
    name: Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run evals
        run: node scripts/run-evals.mjs

      - name: Run RAG retrieval gates
        run: node scripts/run-rag-evals.mjs --self-test && node scripts/run-rag-evals.mjs

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        working-directory: backend-java
        run: mvn test

  postgres-integration:
    name: PostgreSQL Migration Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: codereviewx
          POSTGRES_USER: codereviewx
          POSTGRES_PASSWORD: codereviewx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codereviewx -d codereviewx"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run migration and PostgreSQL tests
        working-directory: backend-java
        run: mvn -B -Dtest=PostgresRagMigrationTest,PostgresJpaCompatibilityTest test

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-and-images:
    name: Security Scans and Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Static scan
        run: node scripts/static-scan.mjs
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Dependency scan
        run: node scripts/dependency-scan.mjs
      - name: Build delivery images
        run: docker compose build
