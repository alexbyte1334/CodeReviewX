name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  repository-structure:
    name: Repository Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "Checking required files..."
          test -f README.md
          test -f docs/PRD.md
          test -f docs/ARCHITECTURE.md
          test -f docs/API.md
          test -f docs/DATABASE.md
          test -f docs/STATIC_ANALYSIS.md
          test -f docs/SECURITY_CHECKLIST.md
          test -f docs/PROJECT_SUMMARY_AND_NEXT_STEPS.md
          test -f backend-java/README.md
          test -f frontend/README.md
          test -f .env.example
          test -f .gitignore
          test -f .semgrep.yml
          test -f scripts/static-scan.mjs
          test -f scripts/secret-scan.mjs
          test -f scripts/dependency-scan.mjs
          test -f scripts/run-evals.mjs
          test -f docker-compose.yml
          echo "All required files exist. Repository structure check passed."

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run static analysis
        run: REQUIRE_SEMGREP=1 node scripts/static-scan.mjs

  evals:
    name: Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run evals
        run: node scripts/run-evals.mjs

      - name: Run RAG retrieval gates
        run: node scripts/run-rag-evals.mjs --self-test && node scripts/run-rag-evals.mjs

      - name: Verify stable JavaScript RAG baseline
        run: |
          git diff --exit-code -- evals/rag/reports/latest.json evals/rag/reports/latest.md
          test -z "$(git status --porcelain --untracked-files=all -- evals/rag/reports/latest.json evals/rag/reports/latest.md)"

  agent-spike:
    name: Dynamic Agent Spike
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-spike/pyproject.toml

      - name: Install evaluation spike
        working-directory: agent-spike
        run: python -m pip install -e .

      - name: Run safety and adapter tests
        working-directory: agent-spike
        run: python -m unittest discover -s tests -v

      - name: Verify deterministic Fake Provider report
        working-directory: agent-spike
        run: |
          python -m codereviewx_agent.eval_runner
          git diff --exit-code -- evals/latest.json
          test -z "$(git status --porcelain --untracked-files=all -- evals/latest.json)"

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        working-directory: backend-java
        run: mvn test

  postgres-integration:
    name: PostgreSQL RAG Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: codereviewx
          POSTGRES_USER: codereviewx
          POSTGRES_PASSWORD: codereviewx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codereviewx -d codereviewx"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run migration and Java production RAG quality gates
        working-directory: backend-java
        run: >-
          mvn -B -Ppostgres-integration
          -Drag.performance.enabled=true
          -Dtest=PostgresRagMigrationTest,PostgresJpaCompatibilityTest,RagRetrievalQualityAcceptanceTest,RagFindingQualityAcceptanceTest,RagPerformanceAcceptanceTest
          verify

      - name: Verify stable Java production RAG baseline
        run: |
          git diff --exit-code -- evals/rag/reports/java-production-latest.json evals/rag/reports/java-production-latest.md
          test -z "$(git status --porcelain --untracked-files=all -- evals/rag/reports/java-production-latest.json evals/rag/reports/java-production-latest.md)"
          git diff --exit-code -- evals/rag/reports/java-production-finding-latest.json evals/rag/reports/java-production-finding-latest.md
          test -z "$(git status --porcelain --untracked-files=all -- evals/rag/reports/java-production-finding-latest.json evals/rag/reports/java-production-finding-latest.md)"

      - name: Upload RAG performance runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-performance-runtime-${{ github.run_id }}
          path: backend-java/target/rag-reports/performance-runtime.*
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-and-images:
    name: Security Scans and Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Static scan
        run: node scripts/static-scan.mjs
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Dependency scan
        run: node scripts/dependency-scan.mjs
      - name: Build delivery images
        run: docker compose build
