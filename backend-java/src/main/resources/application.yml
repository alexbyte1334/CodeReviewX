spring:
  application:
    name: codereviewx-backend
  profiles:
    active: local
  datasource:
    url: jdbc:h2:file:./data/codereviewx;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: true

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health:
    show-details: when_authorized
    probes.enabled: true
    group.readiness:
      include: readinessState,database,github,embedding,rerank

codereviewx:
  demo:
    enabled: ${DEMO_ENABLED:true}
    scenario-id: ${DEMO_SCENARIO_ID:sql-injection-pr}
    repo-url: ${DEMO_REPO_URL:https://github.com/alexbyte1334/CodeReviewX-DemoTarget}
    pr-number: ${DEMO_PR_NUMBER:1}
    expected-head-sha: ${DEMO_EXPECTED_HEAD_SHA:d5aa95a3f43f23ca438e53e94c4d3bed4868904a}
    admin-token: ${DEMO_ADMIN_TOKEN:}
    ip-hash-salt: ${DEMO_IP_HASH_SALT:change-me-in-production}
    requests-per-hour: ${DEMO_REQUESTS_PER_HOUR:3}
    concurrent-per-ip: ${DEMO_CONCURRENT_PER_IP:1}
    global-concurrency: ${DEMO_GLOBAL_CONCURRENCY:2}
    lease-duration: ${DEMO_LEASE_DURATION:120s}
    execution-deadline: ${DEMO_EXECUTION_DEADLINE:90s}
    poll-interval-ms: ${DEMO_POLL_INTERVAL_MS:500}
    allowed-origins:
      - ${DEMO_PAGES_ORIGIN:https://alexbyte1334.github.io}
      - ${DEMO_LOCAL_ORIGIN:http://localhost:5173}
  rag:
    retention:
      cleanup-cron: ${RAG_RETENTION_CLEANUP_CRON:0 15 2 * * *}
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    timeout-seconds: ${GITHUB_TIMEOUT_SECONDS:20}
    max-changed-files: ${GITHUB_MAX_CHANGED_FILES:50}
    max-diff-bytes: ${GITHUB_MAX_DIFF_BYTES:512000}
    per-file-patch-max-bytes: ${GITHUB_PER_FILE_PATCH_MAX_BYTES:20000}
    max-context-files: ${GITHUB_MAX_CONTEXT_FILES:8}
    per-file-context-max-bytes: ${GITHUB_PER_FILE_CONTEXT_MAX_BYTES:12000}
    max-context-bytes: ${GITHUB_MAX_CONTEXT_BYTES:48000}
  ai:
    mimo:
      base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
      model: ${MIMO_MODEL:mimo-v2.5-pro}
      planner-api-key: ${MIMO_PLANNER_API_KEY:}
      executor-api-key: ${MIMO_EXECUTOR_API_KEY:}
      timeout-seconds: ${MIMO_TIMEOUT_SECONDS:60}
