spring:
  application:
    name: codereviewx-backend
  profiles:
    active: local
  datasource:
    url: jdbc:h2:file:./data/codereviewx;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: true

server:
  port: ${BACKEND_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

management:
  endpoints.web.exposure.include: ${MANAGEMENT_ENDPOINTS_EXPOSED:health}
  endpoint.health:
    show-details: when_authorized
    probes.enabled: true
    group.readiness:
      include: readinessState,database,github,embedding,rerank

codereviewx:
  deployment-mode: self-host
  cors:
    allowed-origins: ${CODEREVIEWX_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rag:
    retention:
      cleanup-cron: ${RAG_RETENTION_CLEANUP_CRON:0 15 2 * * *}
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    timeout-seconds: ${GITHUB_TIMEOUT_SECONDS:20}
    max-changed-files: ${GITHUB_MAX_CHANGED_FILES:50}
    max-diff-bytes: ${GITHUB_MAX_DIFF_BYTES:512000}
    per-file-patch-max-bytes: ${GITHUB_PER_FILE_PATCH_MAX_BYTES:20000}
    max-context-files: ${GITHUB_MAX_CONTEXT_FILES:8}
    per-file-context-max-bytes: ${GITHUB_PER_FILE_CONTEXT_MAX_BYTES:12000}
    max-context-bytes: ${GITHUB_MAX_CONTEXT_BYTES:48000}
  ai:
    mimo:
      provider: ${MODEL_PROVIDER:mimo}
      base-url: ${MODEL_BASE_URL:${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}}
      model: ${MODEL_NAME:${MIMO_MODEL:mimo-v2.5-pro}}
      api-key: ${MODEL_API_KEY:}
      planner-api-key: ${MIMO_PLANNER_API_KEY:}
      executor-api-key: ${MIMO_EXECUTOR_API_KEY:}
      timeout-seconds: ${MODEL_TIMEOUT_SECONDS:${MIMO_TIMEOUT_SECONDS:45}}
      max-completion-tokens: ${MODEL_MAX_COMPLETION_TOKENS:${MIMO_MAX_COMPLETION_TOKENS:2048}}
      planner-max-completion-tokens: ${MODEL_PLANNER_MAX_COMPLETION_TOKENS:${MIMO_PLANNER_MAX_COMPLETION_TOKENS:1024}}
      executor-max-completion-tokens: ${MODEL_EXECUTOR_MAX_COMPLETION_TOKENS:${MIMO_EXECUTOR_MAX_COMPLETION_TOKENS:2048}}
      gatekeeper-max-completion-tokens: ${MODEL_GATEKEEPER_MAX_COMPLETION_TOKENS:${MIMO_GATEKEEPER_MAX_COMPLETION_TOKENS:384}}
