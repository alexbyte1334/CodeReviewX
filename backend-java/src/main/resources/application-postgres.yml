spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:codereviewx}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:codereviewx}
    password: ${POSTGRES_PASSWORD:codereviewx}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/rag/postgresql
    init-sqls:
      - "CREATE SCHEMA IF NOT EXISTS flyway_compat; DO $$ BEGIN CREATE DOMAIN flyway_compat.CLOB AS TEXT; EXCEPTION WHEN duplicate_object THEN NULL; END $$; SET search_path TO public, flyway_compat"
  h2:
    console:
      enabled: false

codereviewx:
  rag:
    enabled: ${RAG_ENABLED:false}
    review-percentage: ${RAG_REVIEW_PERCENTAGE:0}
    fallback-enabled: ${RAG_FALLBACK_ENABLED:true}
    require-evidence: ${RAG_REQUIRE_EVIDENCE:true}
    embedding-base-url: ${RAG_EMBEDDING_BASE_URL:}
    embedding-api-key: ${RAG_EMBEDDING_API_KEY:}
    embedding-model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:32}
    rerank-base-url: ${RAG_RERANK_BASE_URL:}
    rerank-api-key: ${RAG_RERANK_API_KEY:}
    rerank-model: ${RAG_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    timeout-seconds: ${RAG_MODEL_TIMEOUT_SECONDS:30}
    max-retries: ${RAG_MODEL_MAX_RETRIES:2}
    work-root: ${RAG_WORK_ROOT:${user.home}/.codereviewx/rag-work}
    fetch-depth: ${RAG_FETCH_DEPTH:50}
    max-file-bytes: ${RAG_MAX_FILE_BYTES:1048576}
    max-files: ${RAG_MAX_FILES:5000}
    max-text-bytes: ${RAG_MAX_TEXT_BYTES:104857600}
    max-scanned-entries: ${RAG_MAX_SCANNED_ENTRIES:50000}
    max-scanned-bytes: ${RAG_MAX_SCANNED_BYTES:524288000}
    shutdown-grace-seconds: ${RAG_SHUTDOWN_GRACE_SECONDS:30}
    retention:
      cleanup-cron: ${RAG_RETENTION_CLEANUP_CRON:0 15 2 * * *}
